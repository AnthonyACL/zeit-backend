version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeit-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - laravel
    depends_on:
      - db
      - redis
      - soketi
    ports:
      - "8000:80"
    command: php artisan serve --host=0.0.0.0 --port=80

  redis:
    image: redis:alpine
    container_name: zeit-redis
    ports:
      - "6379:6379"
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: zeit-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zeit
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel

  soketi:
    image: "quay.io/soketi/soketi:1.4-16-debian"
    container_name: zeit-soketi
    restart: unless-stopped
    environment:
      SOKETI_DEFAULT_APP_ID: "${PUSHER_APP_ID}"
      SOKETI_DEFAULT_APP_KEY: "${PUSHER_APP_KEY}"
      SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET}"
      SOKETI_DEFAULT_APP_HOST: "0.0.0.0"
      SOKETI_BACKEND_TYPE: "redis"
      SOKETI_REDIS_HOST: "redis"
      SOKETI_REDIS_PORT: "6379"
      SOKETI_DEBUG: "1"
      SOKETI_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "6001:6001"
      - "9601:9601"
    networks:
      - laravel
    depends_on:
      - redis

networks:
  laravel:

volumes:
  dbdata:
